<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Applied AI Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14212b;
        --muted: #5a6b78;
        --line: rgba(20, 33, 43, 0.12);
        --panel: rgba(255, 255, 255, 0.72);
        --user: #0f6e6a;
        --user-soft: rgba(15, 110, 106, 0.1);
        --assistant: #f4f7f8;
        --danger: #9b2c2c;
        --shadow: 0 18px 50px rgba(20, 33, 43, 0.08);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Figtree", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(15, 110, 106, 0.18), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(47, 92, 140, 0.14), transparent 50%),
          linear-gradient(180deg, #eef3f5 0%, #e4ecef 45%, #dce7ea 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(20, 33, 43, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20, 33, 43, 0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
      }

      .app {
        position: relative;
        z-index: 1;
        width: min(760px, calc(100% - 2rem));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 1rem;
        padding: 1.25rem 0 1.5rem;
      }

      header {
        animation: rise 0.55s ease both;
      }

      .brand {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .tagline {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .meta-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.75rem;
        margin-top: 0.85rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        color: var(--muted);
      }

      .meta-bar span {
        padding: 0.28rem 0.55rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.45);
      }

      .chat-shell {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: calc(var(--radius) + 4px);
        background: var(--panel);
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow);
        overflow: hidden;
        animation: rise 0.7s ease both;
        animation-delay: 0.08s;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.1rem 1.1rem 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        scroll-behavior: smooth;
      }

      .empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
        max-width: 22rem;
        padding: 2rem 1rem;
        animation: fade 0.6s ease both;
      }

      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 1.05rem;
        margin-bottom: 0.35rem;
      }

      .msg {
        max-width: min(92%, 560px);
        padding: 0.8rem 0.95rem;
        border-radius: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        animation: bubble 0.28s ease both;
      }

      .msg.user {
        align-self: flex-end;
        background: var(--user);
        color: #f7fffe;
        border-bottom-right-radius: 6px;
      }

      .msg.assistant {
        align-self: flex-start;
        background: var(--assistant);
        border: 1px solid var(--line);
        border-bottom-left-radius: 6px;
      }

      .msg.error {
        align-self: stretch;
        background: #fff5f5;
        border: 1px solid rgba(155, 44, 44, 0.25);
        color: var(--danger);
      }

      .msg .role {
        display: block;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 0.3rem;
      }

      .msg.user .role {
        color: rgba(247, 255, 254, 0.8);
      }

      .msg .latency {
        display: block;
        margin-top: 0.45rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
        color: var(--muted);
      }

      .typing {
        display: inline-flex;
        gap: 0.3rem;
        align-items: center;
        padding: 0.2rem 0;
      }

      .typing i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        animation: bounce 1.1s infinite ease-in-out;
      }

      .typing i:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing i:nth-child(3) {
        animation-delay: 0.3s;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.65rem;
        padding: 0.9rem;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.55);
        animation: rise 0.75s ease both;
        animation-delay: 0.14s;
      }

      textarea {
        resize: none;
        min-height: 52px;
        max-height: 160px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.8rem 0.9rem;
        font: inherit;
        color: var(--ink);
        background: #fff;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      textarea:focus {
        border-color: rgba(15, 110, 106, 0.55);
        box-shadow: 0 0 0 3px rgba(15, 110, 106, 0.12);
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 0 1.15rem;
        font: inherit;
        font-weight: 600;
        color: #f7fffe;
        background: var(--ink);
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
      }

      button:hover:not(:disabled) {
        background: #0c1820;
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes bubble {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        40% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      @media (max-width: 560px) {
        .app {
          width: calc(100% - 1rem);
          padding-top: 0.85rem;
        }

        form {
          grid-template-columns: 1fr;
        }

        button {
          min-height: 48px;
        }
      .mode-tabs {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .tab-btn {
        background: rgba(255, 255, 255, 0.45);
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .tab-btn.active {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      .extracted-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.85rem 1rem;
        margin-top: 0.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .extracted-card .ext-title {
        font-weight: 700;
        font-size: 1rem;
        color: var(--ink);
      }

      .extracted-card .ext-summary {
        font-size: 0.88rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .extracted-card .ext-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-top: 0.25rem;
      }

      .extracted-card .tag-badge {
        background: var(--user-soft);
        color: var(--user);
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1 class="brand">Applied AI Lab</h1>
        <p class="tagline">Chat with your local Ollama model or extract structured JSON data.</p>
        <div class="meta-bar">
          <span id="status">Ready</span>
          <span id="model-label">model: …</span>
        </div>
        <div class="mode-tabs">
          <button type="button" class="tab-btn active" id="tab-chat">💬 Multi-turn Chat</button>
          <button type="button" class="tab-btn" id="tab-extract">🧩 JSON Extractor</button>
          <button type="button" class="tab-btn" id="tab-rag">📚 Docs Q&A (RAG)</button>
          <button type="button" class="tab-btn" id="tab-agent">🤖 Autonomous Agent</button>
        </div>
      </header>

      <main class="chat-shell">
        <div id="messages">
          <div class="empty" id="empty">
            <strong id="empty-title">Start a conversation</strong>
            <span id="empty-desc">Ask anything — for example, “What is an LLM API in one sentence?”</span>
          </div>
        </div>

        <form id="chat-form">
          <textarea
            id="input"
            rows="2"
            maxlength="4000"
            placeholder="Type a message…"
            autofocus
          ></textarea>
          <button type="submit" id="send">Send</button>
        </form>
      </main>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const emptyEl = document.getElementById("empty");
      const emptyTitle = document.getElementById("empty-title");
      const emptyDesc = document.getElementById("empty-desc");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const statusEl = document.getElementById("status");
      const modelLabel = document.getElementById("model-label");
      const tabChat = document.getElementById("tab-chat");
      const tabExtract = document.getElementById("tab-extract");
      const tabRag = document.getElementById("tab-rag");
      const tabAgent = document.getElementById("tab-agent");

      /** @type {"chat" | "extract" | "rag" | "agent"} */
      let currentMode = "chat";

      /** @type {{ role: "user" | "assistant"; content: string }[]} */
      const history = [];
      let busy = false;

      tabChat.addEventListener("click", () => setMode("chat"));
      tabExtract.addEventListener("click", () => setMode("extract"));
      tabRag.addEventListener("click", () => setMode("rag"));
      tabAgent.addEventListener("click", () => setMode("agent"));

      function setMode(mode) {
        if (currentMode === mode) return;
        currentMode = mode;

        tabChat.classList.toggle("active", mode === "chat");
        tabExtract.classList.toggle("active", mode === "extract");
        tabRag.classList.toggle("active", mode === "rag");
        tabAgent.classList.toggle("active", mode === "agent");

        if (mode === "chat") {
          input.placeholder = "Type a message…";
          if (emptyTitle) emptyTitle.textContent = "Start a conversation";
          if (emptyDesc) emptyDesc.textContent = 'Ask anything — for example, “What is an LLM API in one sentence?”';
        } else if (mode === "extract") {
          input.placeholder = "Paste text to extract structured JSON (title, summary, tags)…";
          if (emptyTitle) emptyTitle.textContent = "Extract Structured JSON";
          if (emptyDesc) emptyDesc.textContent = "Paste any raw text or article paragraph to extract clean JSON matching schema.";
        } else if (mode === "rag") {
          input.placeholder = "Ask a question about local documentation (e.g. 'What port does the app run on?')...";
          if (emptyTitle) emptyTitle.textContent = "Docs Q&A (RAG)";
          if (emptyDesc) emptyDesc.textContent = "Ask questions grounded strictly in local docs/*.md files with citations.";
        } else if (mode === "agent") {
          input.placeholder = "Give the agent a task requiring tools (e.g., 'Find Kai in the database and calculate 99 * 0.92')...";
          if (emptyTitle) emptyTitle.textContent = "Autonomous AI Agent (ReAct Loop)";
          if (emptyDesc) emptyDesc.textContent = "Autonomous agent that reasons step-by-step, calls tools (SQL, RAG, Calc, System), and streams live execution trace.";
        }
      }

      function hideEmpty() {
        if (emptyEl) emptyEl.style.display = "none";
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addMessage(role, content, extra = {}) {
        hideEmpty();
        const el = document.createElement("div");
        el.className = `msg ${role}${extra.error ? " error" : ""}`;

        const roleLabel = document.createElement("span");
        roleLabel.className = "role";
        roleLabel.textContent = extra.error ? "Error" : role === "user" ? "You" : role === "agent" ? "Autonomous Agent" : "Assistant";
        el.appendChild(roleLabel);

        const body = document.createElement("div");
        
        if (extra.agentSteps) {
          const stepsContainer = document.createElement("div");
          stepsContainer.style.cssText = "display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.75rem;";
          
          extra.agentSteps.forEach((s) => {
            const stepBox = document.createElement("div");
            stepBox.style.cssText = "background:rgba(255,255,255,0.85); border:1px solid var(--line); border-radius:10px; padding:0.6rem 0.75rem; font-size:0.82rem;";
            
            let innerHtml = `<div style="font-weight:600; color:var(--user); margin-bottom:0.25rem;">Step ${s.step}: Reasoning</div>`;
            innerHtml += `<div style="color:var(--ink); margin-bottom:0.35rem; line-height:1.4;">${escapeHtml(s.thought)}</div>`;

            if (s.toolCall) {
              innerHtml += `
                <div style="background:rgba(15,110,106,0.08); border-left:3px solid var(--user); padding:0.4rem 0.6rem; border-radius:6px; margin-top:0.35rem; font-family:'JetBrains Mono',monospace; font-size:0.75rem;">
                  <strong>🔧 Tool Executed:</strong> ${escapeHtml(s.toolCall.name)}
                  <div style="margin-top:0.2rem; color:var(--muted);">Args: ${escapeHtml(JSON.stringify(s.toolCall.args))}</div>
                  <div style="margin-top:0.25rem; color:var(--ink);">Result: ${escapeHtml(JSON.stringify(s.toolResult))}</div>
                </div>
              `;
            }

            stepBox.innerHTML = innerHtml;
            stepsContainer.appendChild(stepBox);
          });

          body.appendChild(stepsContainer);

          const answerBox = document.createElement("div");
          answerBox.style.cssText = "background:#fff; border:1px solid rgba(15,110,106,0.3); border-radius:12px; padding:0.75rem; font-size:0.92rem; font-weight:500; line-height:1.5; color:var(--ink);";
          answerBox.innerHTML = `<strong style="color:var(--user); display:block; margin-bottom:0.25rem;">🎯 Final Answer:</strong> ${escapeHtml(content)}`;
          body.appendChild(answerBox);
        } else if (extra.extractedData) {
          const d = extra.extractedData;
          body.innerHTML = `
            <div class="extracted-card">
              <div class="ext-title">${escapeHtml(d.title)}</div>
              <div class="ext-summary">${escapeHtml(d.summary)}</div>
              <div class="ext-tags">
                ${(d.tags || []).map(t => `<span class="tag-badge">#${escapeHtml(t)}</span>`).join("")}
              </div>
            </div>
            <pre style="font-family:'JetBrains Mono',monospace; font-size:0.75rem; background:rgba(0,0,0,0.04); padding:0.6rem; border-radius:8px; margin-top:0.6rem; overflow-x:auto;">${escapeHtml(JSON.stringify(d, null, 2))}</pre>
          `;
        } else {
          body.textContent = content;
        }

        if (Array.isArray(extra.sources) && extra.sources.length > 0) {
          const sourcesContainer = document.createElement("div");
          sourcesContainer.style.cssText = "margin-top:0.65rem; padding-top:0.6rem; border-top:1px dashed var(--line); font-size:0.78rem;";
          
          const header = document.createElement("div");
          header.style.cssText = "font-weight:600; color:var(--muted); margin-bottom:0.4rem;";
          header.textContent = "📌 Retrieved Sources:";
          sourcesContainer.appendChild(header);

          extra.sources.forEach((src) => {
            const item = document.createElement("details");
            item.style.cssText = "background:rgba(255,255,255,0.7); border:1px solid var(--line); border-radius:8px; padding:0.35rem 0.55rem; margin-bottom:0.35rem; cursor:pointer;";
            item.innerHTML = `
              <summary style="font-weight:600; color:var(--user);">
                ${escapeHtml(src.label)}: <span style="color:var(--ink);">${escapeHtml(src.filename)}</span>
                <span style="font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); float:right;">Match: ${src.scorePercent}%</span>
              </summary>
              <p style="margin:0.35rem 0 0; color:var(--muted); font-size:0.76rem; line-height:1.4; white-space:pre-wrap;">${escapeHtml(src.excerpt)}</p>
            `;
            sourcesContainer.appendChild(item);
          });

          body.appendChild(sourcesContainer);
        }

        el.appendChild(body);

        if (typeof extra.latencyMs === "number") {
          const meta = document.createElement("span");
          meta.className = "latency";
          meta.textContent = `${extra.latencyMs} ms`;
          el.appendChild(meta);
        }

        messagesEl.appendChild(el);
        scrollToBottom();
        return el;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function setBusy(next) {
        busy = next;
        sendBtn.disabled = next;
        input.disabled = next;
        statusEl.textContent = next ? "Thinking…" : "Ready";
      }

      function autoGrow() {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
      }

      input.addEventListener("input", autoGrow);

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;

        addMessage("user", text);
        input.value = "";
        autoGrow();

        const thinking = addMessage("assistant", "");
        thinking.querySelector("div").innerHTML =
          '<span class="typing" aria-label="Assistant is typing"><i></i><i></i><i></i></span>';

        setBusy(true);

        try {
          if (currentMode === "chat") {
            history.push({ role: "user", content: text });
            const response = await fetch("/api/basic/chat/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ messages: history }),
            });

            thinking.remove();

            if (!response.ok) {
              const data = await response.json();
              const detail = data.detail ? `\n${data.detail}` : "";
              addMessage("assistant", `${data.error || "Request failed."}${detail}`, { error: true });
              history.pop();
              return;
            }

            const streamMsgEl = addMessage("assistant", "");
            const bodyEl = streamMsgEl.querySelector("div");
            let accumulatedText = "";

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const events = buffer.split("\n\n");
              buffer = events.pop() || "";

              for (const evt of events) {
                const line = evt.trim();
                if (line.startsWith("data: ")) {
                  const jsonStr = line.replace(/^data:\s*/, "");
                  try {
                    const payload = JSON.parse(jsonStr);
                    if (payload.token) {
                      accumulatedText += payload.token;
                      bodyEl.textContent = accumulatedText;
                      scrollToBottom();
                    } else if (payload.done && payload.meta) {
                      if (payload.meta.latencyMs) {
                        const meta = document.createElement("span");
                        meta.className = "latency";
                        meta.textContent = `${payload.meta.latencyMs} ms`;
                        streamMsgEl.appendChild(meta);
                      }
                      if (payload.meta.model) {
                        modelLabel.textContent = `model: ${payload.meta.model}`;
                      }
                    }
                  } catch (err) {}
                }
              }
            }

            history.push({ role: "assistant", content: accumulatedText });
          } else if (currentMode === "extract") {

            // JSON Extraction Mode
            const response = await fetch("/api/basic/extract", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text }),
            });

            const data = await response.json();
            thinking.remove();

            if (!response.ok) {
              const detail = data.detail ? `\n${data.detail}` : "";
              addMessage("assistant", `${data.error || "Extraction failed."}${detail}`, { error: true });
              return;
            }

            addMessage("assistant", "", {
              extractedData: data.data,
              latencyMs: data.meta?.latencyMs,
            });

            if (data.meta?.model) {
              modelLabel.textContent = `model: ${data.meta.model}`;
            }
          } else if (currentMode === "rag") {
            // RAG Docs Q&A Mode
            const response = await fetch("/api/basic/ask-docs", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question: text }),
            });

            const data = await response.json();
            thinking.remove();

            if (!response.ok) {
              const detail = data.detail ? `\n${data.detail}` : "";
              addMessage("assistant", `${data.error || "RAG query failed."}${detail}`, { error: true });
              return;
            }

            addMessage("assistant", data.reply || "(empty reply)", {
              sources: data.sources,
              latencyMs: data.meta?.latencyMs,
            });

            if (data.meta?.model) {
              modelLabel.textContent = `model: ${data.meta.model}`;
            }
          } else if (currentMode === "agent") {
            // Autonomous Agent ReAct Mode
            const response = await fetch("/api/agent/run", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prompt: text }),
            });

            const data = await response.json();
            thinking.remove();

            if (!response.ok) {
              const detail = data.detail ? `\n${data.detail}` : "";
              addMessage("assistant", `${data.error || "Agent execution failed."}${detail}`, { error: true });
              return;
            }

            addMessage("assistant", data.finalAnswer || "(empty answer)", {
              agentSteps: data.steps,
              latencyMs: data.meta?.latencyMs,
            });

            if (data.meta?.model) {
              modelLabel.textContent = `model: ${data.meta.model}`;
            }
          }
        } catch (error) {
          thinking.remove();
          addMessage(
            "assistant",
            error instanceof Error ? error.message : "Network error talking to the server.",
            { error: true }
          );
          if (currentMode === "chat") history.pop();
        } finally {
          setBusy(false);
          input.focus();
        }
      });
    </script>

  </body>
</html>
